<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title> OPTION </title>
		<style type="text/css">
		html, body {width:100%; height:100%; margin:0; padding:0; border:0; background-color:#f1f1f1;}
		div {box-sizing:border-box;}

		#vspace {height:3vh;}
		#pan {position:relative; width:109vh; height:65vh; background-color:white; border:solid 1px #b5b5b5; margin:auto;}

		#logo {width:96%; height:5%; margin:auto; text-align:right;}
		#logo img {width:13%; height:auto; margin-top:1%;}

		#cont {width:98%; height:95%; margin:auto;}
		#cont iframe {width:100%; height:100%; border:0;}

		#txt1 {width:100%; height:11vh; text-align:center; font-size:6vh; margin-top:1%; color:#00448d;}
		#txt2 {width:100%; height:17vh; text-align:center; font-size:4vh; color:#58595b;}
		</style>

		<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
		<script>
			
			//현재 옵션코드 ID 값 설정영역//
			var now_id = "drive8";
			//현재 옵션코드 ID 값 설정영역 끝//
			
			var cont = "http://hd.drkomo.com/hdop/contents/" + now_id + "/" + now_id + ".html";

			$(document).ready(function() {
				
				$("#cont iframe").attr("src", cont);
				$.post("http://ntips.com/hd/hdop.php",
				{
					con_id: now_id
				},
				function(data){
					var conTxt = decodeURIComponent(data);
					conTxt = conTxt.split(":::");
					$("#txt1").html(conTxt[0]);
					$("#txt2").html(conTxt[1]);
				});
			});
		</script>
	</head>

	<body>
		<div id="vspace"></div>
		<div id="pan">
			<div id="logo"><img src="logo.png"></div>
			<div id="cont"><iframe></iframe></div>
		</div>
		<div id="txt1"></div>
		<div id="txt2"></div>
	</body>
</html>
